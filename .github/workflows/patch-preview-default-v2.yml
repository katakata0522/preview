name: One-time preview patch v2

on:
  push:
    branches:
      - refactor-split-html-css-js
    paths:
      - .github/workflows/patch-preview-default-v2.yml

permissions:
  contents: write

jobs:
  patch-target-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: fix/preview-history-share-import-v2
          fetch-depth: 0

      - name: Patch and verify target branch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('script.js')
          source = path.read_text(encoding='utf-8')
          original = source

          def sub_once(pattern, replacement, label, flags=0):
              global source
              source, count = re.subn(pattern, replacement, source, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {count}')

          sub_once(
              r'^(\s*const DEFAULT_TAB_NAME = "無題";[^\n]*)$',
              r'''\1
              const MAX_TABS = 50;
              const MAX_TAB_NAME_LENGTH = 100;
              const MAX_TAB_CONTENT_LENGTH = 500000;
              const MAX_TOTAL_CONTENT_LENGTH = 1500000;
              const MAX_IMPORT_FILE_SIZE = 2 * 1024 * 1024;''',
              'constants',
              re.MULTILINE
          )

          helpers = '''  function toBase64Url(str) {
              return toBase64(str)
                .replace(/\\+/g, '-')
                .replace(/\\//g, '_')
                .replace(/=+$/g, '');
            }

            function fromBase64Url(base64UrlStr) {
              const normalized = base64UrlStr
                .replace(/ /g, '+')
                .replace(/-/g, '+')
                .replace(/_/g, '/');
              const padding = '='.repeat((4 - normalized.length % 4) % 4);
              return fromBase64(normalized + padding);
            }

            function validateTabsData(data) {
              if (!Array.isArray(data) || data.length === 0 || data.length > MAX_TABS) {
                throw new Error(`タブ数は1〜${MAX_TABS}件である必要があります。`);
              }

              let totalLength = 0;
              return data.map((tab, index) => {
                if (!tab || typeof tab !== 'object' || Array.isArray(tab)) {
                  throw new Error(`タブ${index + 1}の形式が正しくありません。`);
                }

                const readText = (key, fallback = '') => {
                  const value = tab[key];
                  if (value === undefined || value === null) return fallback;
                  if (typeof value !== 'string') {
                    throw new Error(`タブ${index + 1}の${key}は文字列である必要があります。`);
                  }
                  return value;
                };

                const name = readText('name', `${DEFAULT_TAB_NAME}${index + 1}`);
                const html = readText('html');
                const css = readText('css');
                const js = readText('js');
                const note = readText('note');

                if (name.length === 0 || name.length > MAX_TAB_NAME_LENGTH) {
                  throw new Error(`タブ${index + 1}の名前が長すぎるか空です。`);
                }
                for (const [key, value] of Object.entries({ html, css, js, note })) {
                  if (value.length > MAX_TAB_CONTENT_LENGTH) {
                    throw new Error(`タブ${index + 1}の${key}が大きすぎます。`);
                  }
                }

                totalLength += name.length + html.length + css.length + js.length + note.length;
                if (totalLength > MAX_TOTAL_CONTENT_LENGTH) {
                  throw new Error('インポートデータ全体が大きすぎます。');
                }

                const lastExec = tab.lastExec === null || tab.lastExec === undefined
                  ? null
                  : readText('lastExec');
                const execCount = Number.isInteger(tab.execCount) && tab.execCount >= 0
                  ? tab.execCount
                  : 0;

                return { name, html, css, js, note, lastExec, execCount };
              });
            }

          '''
          marker = '  // --- サイドバーUI構築 ---'
          if source.count(marker) != 1:
              raise SystemExit(f'helper marker count: {source.count(marker)}')
          source = source.replace(marker, helpers + marker, 1)

          if source.count("fromBase64(urlParams.get('data'))") != 1:
              raise SystemExit('URL decoder call not found exactly once')
          source = source.replace("fromBase64(urlParams.get('data'))", "fromBase64Url(urlParams.get('data'))", 1)

          sub_once(
              r'''if \(Array\.isArray\(arr\) && arr\.length\) \{\s*tabs = arr;\s*current = 0;\s*history\.replaceState\(\{\}, document\.title, location\.pathname\);\s*return;\s*\}''',
              '''tabs = validateTabsData(arr);
                  current = 0;
                  history.replaceState({}, document.title, location.pathname);
                  return;''',
              'URL data validation',
              re.DOTALL
          )

          sub_once(
              r'''if \(Array\.isArray\(data\) && data\.length > 0\) \{\s*tabs = data;\s*current = Math\.min\(current, tabs\.length - 1\);\s*return;\s*\}''',
              '''tabs = validateTabsData(data);
                  current = Math.min(current, tabs.length - 1);
                  return;''',
              'stored data validation',
              re.DOTALL
          )

          sub_once(
              r'''function saveTabs\(\) \{\s*localStorage\.setItem\(STORAGE_KEY, JSON\.stringify\(tabs\)\);\s*\}''',
              '''function saveTabs() {
              try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(tabs));
                return true;
              } catch (error) {
                console.error('Failed to save tabs to localStorage:', error);
                if (saveNoticeEl) showSaveNotice('保存容量を超えたため保存できませんでした');
                return false;
              }
            }''',
              'save error handling',
              re.DOTALL
          )

          sub_once(r'function pushUndo\(\)', 'function pushUndo(serializedState = JSON.stringify(tabs))', 'pushUndo signature')
          sub_once(
              r'''(function pushUndo\([^\n]*\) \{\s*if \(lockStack\) return;\s*)const data = JSON\.stringify\(tabs\);''',
              r'''\1const data = serializedState;''',
              'pushUndo snapshot',
              re.DOTALL
          )

          sub_once(
              r'''function handleEditorInput\(\) \{\s*if \(!tabs\[current\]\) return;\s*tabs\[current\]\.html = document\.getElementById\('html'\)\?\.value \|\| '';\s*tabs\[current\]\.css = document\.getElementById\('css'\)\?\.value \|\| '';\s*tabs\[current\]\.js = document\.getElementById\('js'\)\?\.value \|\| '';\s*pushUndo\(\);\s*\}''',
              '''function handleEditorInput() {
              if (!tabs[current]) return;
              const previousState = JSON.stringify(tabs);
              tabs[current].html = document.getElementById('html')?.value || '';
              tabs[current].css = document.getElementById('css')?.value || '';
              tabs[current].js = document.getElementById('js')?.value || '';
              pushUndo(previousState);
            }''',
              'editor undo boundary',
              re.DOTALL
          )

          sub_once(
              r'''(function importTabs\(e\) \{\s*const file = e\.target\.files\[0\];\s*if \(!file\) return;)''',
              r'''\1
              if (file.size > MAX_IMPORT_FILE_SIZE) {
                alert('インポート失敗：ファイルサイズは2MB以下にしてください。');
                e.target.value = null;
                return;
              }''',
              'import size check',
              re.DOTALL
          )

          sub_once(
              r'''const importedData = JSON\.parse\(ev\.target\.result\);\s*if \(Array\.isArray\(importedData\) && importedData\.length > 0\) \{\s*pushUndo\(\);\s*tabs = importedData;\s*current = 0;\s*renderTabs\(\);\s*runCode\(\);\s*saveTabs\(\);\s*alert\("タブデータをインポートしました！"\);\s*\} else \{\s*alert\("インポート失敗：無効なデータ形式です。"\);\s*\}''',
              '''const importedData = JSON.parse(ev.target.result);
                  const validatedTabs = validateTabsData(importedData);
                  pushUndo();
                  tabs = validatedTabs;
                  current = 0;
                  renderTabs();
                  runCode();
                  saveTabs();
                  alert("タブデータをインポートしました！");''',
              'import schema validation',
              re.DOTALL
          )

          if source.count('const base64Param = toBase64(jsonString);') != 1:
              raise SystemExit('legacy share encoder not found once')
          source = source.replace('const base64Param = toBase64(jsonString);', 'const base64Param = toBase64Url(jsonString);', 1)

          sub_once(
              r'''const shareUrl = `\$\{location\.origin\}\$\{location\.pathname\}\?data=\$\{base64Param\}`;\s*prompt\("このURLをコピーして共有できます！（内容が長すぎる場合は先頭3タブ分まで）", shareUrl\);''',
              '''const shareUrl = new URL(location.href);
                  shareUrl.search = '';
                  shareUrl.hash = '';
                  shareUrl.searchParams.set('data', base64Param);
                  prompt("このURLをコピーして共有できます！（内容が長すぎる場合は先頭3タブ分まで）", shareUrl.toString());''',
              'share URL creation',
              re.DOTALL
          )

          sub_once(
              r'''noteTextareaEl\.addEventListener\('input', \(\) => \{\s*saveCurrentTabData\(\);\s*pushUndo\(\);\s*\}\);''',
              '''noteTextareaEl.addEventListener('input', () => {
                  const previousState = JSON.stringify(tabs);
                  saveCurrentTabData();
                  pushUndo(previousState);
              });''',
              'note undo boundary',
              re.DOTALL
          )

          if source == original:
              raise SystemExit('No changes were made')
          required = [
              'function toBase64Url(str)',
              'function validateTabsData(data)',
              'tabs = validateTabsData(arr);',
              'tabs = validateTabsData(data);',
              'const validatedTabs = validateTabsData(importedData);',
              "shareUrl.searchParams.set('data', base64Param)",
              "showSaveNotice('保存容量を超えたため保存できませんでした')"
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit(f'Missing final boundaries: {missing}')
          if source.count('pushUndo(previousState);') != 2:
              raise SystemExit('Expected two previous-state undo calls')

          path.write_text(source, encoding='utf-8')
          PY

          node --check script.js

          git config user.name "chatgpt-coding-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git commit -m "fix: harden preview history sharing and imports"
          git push origin HEAD:fix/preview-history-share-import-v2

      - name: Remove one-time workflow from default branch
        if: always()
        shell: bash
        run: |
          git fetch origin refactor-split-html-css-js
          git checkout -B refactor-split-html-css-js origin/refactor-split-html-css-js
          if [ -f .github/workflows/patch-preview-default-v2.yml ]; then
            git rm .github/workflows/patch-preview-default-v2.yml
            git config user.name "chatgpt-coding-agent"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: remove one-time preview patch workflow v2"
            git push origin HEAD:refactor-split-html-css-js
          fi
